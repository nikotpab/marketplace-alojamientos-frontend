# Análisis en SonarQube Cloud desde el CI (.github/workflows/ci.yml), con la cobertura de las pruebas.
sonar.host.url=https://sonarcloud.io
sonar.organization=nikotpab
sonar.projectKey=nikotpab_marketplace-alojamientos-frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
# src/contract es una copia del contrato del backend y los tipos que se generan de él.
sonar.exclusions=src/**/*.spec.ts,src/contract/**
sonar.javascript.lcov.reportPaths=coverage/marketplace-alojamientos-frontend/lcov.info
