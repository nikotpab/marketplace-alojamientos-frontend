# Análisis en SonarQube Cloud desde el CI (.github/workflows/ci.yml), con la cobertura de las pruebas.
sonar.host.url=https://sonarcloud.io
sonar.organization=nikotpab
sonar.projectKey=nikotpab_marketplace-alojamientos-frontend
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.spec.ts
# src/contract es una copia del contrato del backend y los tipos que se generan de él.
sonar.exclusions=src/**/*.spec.ts,src/contract/**
sonar.javascript.lcov.reportPaths=coverage/marketplace-alojamientos-frontend/lcov.info
# Reglas que no aplican aquí:
# - Web:S6840 en el teléfono del registro y del perfil: "tel-national" es un valor válido de autocomplete y el correcto
#   para un celular de 10 dígitos sin indicativo; con "tel" el navegador agrega el +57 y el número queda mal.
sonar.issue.ignore.multicriteria=telefonoRegistro,telefonoPerfil
sonar.issue.ignore.multicriteria.telefonoRegistro.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.telefonoRegistro.resourceKey=src/app/pages/auth/auth.component.html
sonar.issue.ignore.multicriteria.telefonoPerfil.ruleKey=Web:S6840
sonar.issue.ignore.multicriteria.telefonoPerfil.resourceKey=src/app/pages/perfil/perfil.component.html
