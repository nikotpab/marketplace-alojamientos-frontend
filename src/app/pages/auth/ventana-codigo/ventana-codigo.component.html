<app-dialogo titulo="Confirma tu correo" [bloqueado]="procesando()" (cerrar)="cerrar.emit()">
  <p class="explicacion">
    Enviamos un código de 6 dígitos a <strong>{{ correo() }}</strong>. Escríbelo para crear tu cuenta; vence en 15 minutos.
  </p>

  <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
    <label for="codigo-registro">Código de verificación</label>
    <input id="codigo-registro" class="codigo" formControlName="codigo" type="text" inputmode="numeric"
           autocomplete="one-time-code" maxlength="6" soloNumeros autofocus
           [attr.aria-invalid]="invalido() || !!error()" aria-describedby="codigo-registro-mensajes" />

    <div id="codigo-registro-mensajes" class="mensajes">
      @if (invalido()) { <small class="error" role="alert">Escribe los 6 dígitos del código.</small> }
      @if (error()) { <small class="error" role="alert">{{ error() }}</small> }
      @if (aviso()) { <small class="exito" role="status">{{ aviso() }}</small> }
    </div>

    <button type="submit" class="btn btn-primario btn-bloque" [disabled]="procesando()">
      {{ procesando() ? 'Creando cuenta...' : 'Confirmar y crear cuenta' }}
    </button>
  </form>

  <div class="secundarias">
    <button type="button" class="enlace" [disabled]="segundos() > 0 || procesando()" (click)="pedirOtro()">
      {{ segundos() > 0 ? 'Reenviar código en ' + segundos() + ' s' : 'Reenviar código' }}
    </button>
    <button type="button" class="enlace" [disabled]="procesando()" (click)="cerrar.emit()">Cambiar correo</button>
  </div>
  <p class="nota">¿No lo encuentras? Revisa la carpeta de spam o de promociones.</p>
</app-dialogo>
