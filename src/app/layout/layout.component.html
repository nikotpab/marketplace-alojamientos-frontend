<div class="pagina">
  <header class="barra">
    <a class="marca" routerLink="/" aria-label="Inversiones LR · Inicio">
      <img src="logo-lr.png" alt="Inversiones LR · Marketplace de alojamientos" />
    </a>

    <nav class="enlaces" aria-label="Navegación principal">
      @for (e of enlaces(); track e.ruta) {
        <a [routerLink]="e.ruta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">{{ e.texto }}</a>
      }
    </nav>

    @if (auth.usuario()) {
    <div class="usuario">
      <span class="avatar" aria-hidden="true">{{ iniciales() }}</span>
      <div class="datos">
        <strong>{{ auth.usuario()?.nombre }}</strong>
        <span>{{ etiquetaRol() }}</span>
      </div>
      <button type="button" class="salir" (click)="salir()">Cerrar sesión</button>
    </div>
    } @else {
      <a class="ingresar" routerLink="/auth">Iniciar sesión</a>
    }
  </header>

  <router-outlet />

  <footer class="pie">
    <span>© 2026 Inversiones LR · Marketplace de alojamientos</span>
    <span>Términos · Privacidad · Ayuda</span>
  </footer>
</div>
