<header class="barra">
  <a class="marca" routerLink="/" aria-label="Inversiones LR · Inicio">
    <img src="logo-lr.png" alt="Inversiones LR · Marketplace de alojamientos" />
  </a>

  <nav class="enlaces" aria-label="Navegación principal">
    @for (e of enlaces(); track e.ruta) {
      <a [routerLink]="e.ruta" routerLinkActive="activo">{{ e.texto }}</a>
    }
  </nav>

  <div class="usuario">
    <div class="datos">
      <strong>{{ auth.usuario()?.nombre }}</strong>
      <span>{{ etiquetaRol() }}</span>
    </div>
    <button type="button" class="salir" (click)="salir()">Cerrar sesión</button>
  </div>
</header>

<router-outlet />
