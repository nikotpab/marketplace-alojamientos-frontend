<div class="calendario">
  <div class="nav">
    <button type="button" (click)="cambiarMes(-1)" [disabled]="enPrimerMes()" aria-label="Meses anteriores">‹</button>
    <button type="button" (click)="cambiarMes(1)" aria-label="Meses siguientes">›</button>
  </div>

  <div class="meses">
    @for (m of calendario(); track m.titulo) {
      <section class="mes" [attr.aria-label]="m.titulo">
        <h3>{{ m.titulo }}</h3>
        <div class="semana" aria-hidden="true"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
        <div class="dias">
          @for (d of m.dias; track $index) {
            @if (d) {
              <button type="button" class="dia"
                      [class.pasado]="d.pasado" [class.bloqueado]="d.bloqueado && !d.pasado"
                      [class.reservado]="d.reservado && !d.pasado" [class.sel]="enRango(d)"
                      [disabled]="!seleccionable() || noElegible(d)"
                      [attr.aria-pressed]="enRango(d)"
                      [attr.title]="d.pasado ? 'Fecha pasada' : d.reservado ? 'Reservado' : d.bloqueado ? 'Bloqueado' : 'Disponible'"
                      (click)="elegir(d)">{{ d.numero }}</button>
            } @else { <span></span> }
          }
        </div>
      </section>
    }
  </div>

  <ul class="leyenda">
    <li><i class="libre"></i> Disponible</li>
    <li><i class="reservado"></i> Reservado</li>
    <li><i class="bloqueado"></i> Bloqueado</li>
    @if (seleccionable()) { <li><i class="sel"></i> Seleccionado</li> }
  </ul>
</div>
