# SCRUM-124: integración continua del frontend
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # SCRUM-121: para volver a desplegar main sin un commit nuevo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  construir-y-probar:
    runs-on: ubuntu-latest

    steps:
      # Descarga el código del PR o del push
      - uses: actions/checkout@v4

      # Instala Node 22 y activa la caché de npm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Instala las dependencias exactas del lockfile
      - run: npm ci

      # Verifica que la app compila sin errores
      - run: npm run build

      # Ejecuta los tests en Chrome sin interfaz gráfica
      - run: npm test -- --watch=false --browsers=ChromeHeadless

  # SCRUM-121: cada push a main que pasa las pruebas publica la imagen en ECR, con el commit como etiqueta, y la despliega
  # en la EC2 por SSM. GitHub entra a AWS por OIDC, sin llaves guardadas. Las variables del repositorio salen del stack
  # deploy/aws/despliegue.yaml del backend; sin ellas el job no corre.
  desplegar:
    needs: construir-y-probar
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROL_DESPLIEGUE != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: despliegue-web
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROL_DESPLIEGUE }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      # La EC2 es ARM (t4g). El Dockerfile compila en la plataforma del runner; solo la imagen final se emula.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.ecr.outputs.registry }}/marketplace-web:${{ github.sha }}
          cache-from: type=gha,scope=marketplace-web
          cache-to: type=gha,mode=max,scope=marketplace-web
      - name: Desplegar en la EC2
        env:
          DOCUMENTO: ${{ vars.AWS_DOCUMENTO_DESPLIEGUE }}
          INSTANCIA: ${{ vars.AWS_INSTANCIA }}
        run: |
          comando=$(aws ssm send-command --document-name "$DOCUMENTO" --instance-ids "$INSTANCIA" \
            --parameters "etiqueta=$GITHUB_SHA" --comment "marketplace-web $GITHUB_SHA" \
            --query Command.CommandId --output text)
          estado=Pending
          for _ in $(seq 60); do
            sleep 10
            estado=$(aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$estado" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$comando" --instance-id "$INSTANCIA" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Resultado del despliegue: $estado"
          test "$estado" = Success
